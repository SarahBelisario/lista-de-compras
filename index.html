<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="shortcut icon" href="/imgs/icon-logo.svg" type="icon-logo.svg" />

    <title>QuickList</title>
  </head>
  <body>
    <header>
      <img src="/imgs/logo.svg" alt="Logo QuickList" class="logo" />
    </header>

    <main class="container">
      <a href="#" class="btn-back">← Voltar</a>
      <h1>Compras da semana</h1>
      
      <form class="add-item-form" id="item-form">
        <input
          id="add-item"
          type="text"
          class="item-input"
          placeholder="Adicione um novo item"
          required
        />
        <button id="registers" type="submit" class="add-btn">
          <span>Adicionar item</span>
        </button>
      </form>

      <section class="lista-container">
        <ul class="lista-compras" id="list"></ul>
      </section>

      <aside class="container alert-container hidden">
        <div class="alert">
          <img src="imgs/assets/alert.svg" alt="Aviso" class="alert-icon" />
          <span>O item foi removido da lista</span>
          <img
            src="imgs/assets/delete-small.svg"
            alt="Fechar"
            class="close-alert-icon"
          />
        </div>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
